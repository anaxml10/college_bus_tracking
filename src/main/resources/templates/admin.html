<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ICCS Admin Fleet & Student Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #090d16; color: #f8fafc; margin: 0; padding: 30px 15px; min-height: 100vh; display: flex; justify-content: center; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(10px); z-index: 999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(212, 175, 55, 0.4); padding: 35px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .login-box input { width: 100%; padding: 12px; background: #090d16; border: 1px solid #d4af37; color: white; border-radius: 8px; margin: 15px 0; outline: none; font-size: 14px; text-align: center; }
        .login-box button { background: linear-gradient(135deg, #d4af37, #f59e0b); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .dashboard { width: 100%; max-width: 1100px; background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px; padding: 30px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 25px; }
        .home-btn { background: linear-gradient(135deg, #d4af37, #f59e0b); color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        .tab-buttons { display: flex; gap: 15px; margin-bottom: 25px; }
        .tab-btn { background: #0f172a; border: 1px solid rgba(212, 175, 55, 0.3); color: #fff; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #d4af37; color: #000; }

        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #090d16; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        
        .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #d4af37; }
        .checkbox-grid label { font-size: 13px; font-weight: normal; color: white; cursor: pointer; }
        .submit-btn { background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 22px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 20px; }
        th { background: rgba(212, 175, 55, 0.1); color: #d4af37; padding: 15px; font-size: 13px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        td { padding: 15px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 style="color: #d4af37; margin-top:0;"><i class="fa-solid fa-lock"></i> ADMIN ACCESS</h2>
            <p style="font-size: 13px; color: #cbd5e1;">Enter Admin Password to continue</p>
            <input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="new-password">
            <button onclick="checkAdminPassword()">LOGIN</button>
            <div id="loginErr" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Incorrect Password!</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="top-nav">
            <h1 style="margin: 0; color: #d4af37; font-size: 22px;"><i class="fa-solid fa-shield-halved"></i> ADMIN MANAGEMENT SYSTEM</h1>
            <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" id="btnBusTab" onclick="switchTab('bus')"><i class="fa-solid fa-bus"></i> Bus Fleet Management</button>
            <button class="tab-btn" id="btnStudentTab" onclick="switchTab('student')"><i class="fa-solid fa-user-graduate"></i> Student Pass Management</button>
        </div>

        <!-- TAB 1: BUS MANAGEMENT -->
        <div id="busTab">
            <form id="addBusForm" onsubmit="addBusAsync(event)" autocomplete="off">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Bus ID (Format: BUS01)</label>
                        <input type="text" id="busId" placeholder="e.g. BUS01" pattern="^BUS[0-9]{2}$" title="Must be BUS followed by 2 digits" required>
                    </div>
                    <div class="input-group">
                        <label>Reg Number (Format: KL 08 AB 1234)</label>
                        <input type="text" id="regNumber" placeholder="e.g. KL 08 AB 1234" pattern="^KL[\s]?[0-9]{2}[\s]?[a-zA-Z]{1,2}[\s]?[0-9]{4}$" title="Must match KL registration pattern" required>
                    </div>
                    <div class="input-group">
                        <label>Route</label>
                        <select id="route" required>
                            <option value="THRISSUR">Thrissur Route</option>
                            <option value="CHALAKUDY">Chalakudy Route</option>
                            <option value="IRINJALAKUDA">Irinjalakuda Route</option>
                            <option value="MANNUTHY">Mannuthy Route</option>
                            <option value="ANGAMALY">Angamaly Route</option>
                            <option value="KODUNGALLUR">Kodungallur Route</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Driver Name</label>
                        <input type="text" id="driverName" placeholder="e.g. Santhosh" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="e.g. 1234" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label style="color:#d4af37; font-size:13px; font-weight: bold;"><i class="fa-solid fa-map-location-dot"></i> Select Stops for this Bus:</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="stops" value="Thrissur Swaraj Round"> Thrissur Round</label>
                        <label><input type="checkbox" name="stops" value="Ollur Junction"> Ollur</label>
                        <label><input type="checkbox" name="stops" value="Amballur Junction"> Amballur</label>
                        <label><input type="checkbox" name="stops" value="Puthukkad Bus Stop"> Puthukkad (NH 544)</label>
                        <label><input type="checkbox" name="stops" value="Kodakara Junction"> Kodakara</label>
                        <label><input type="checkbox" name="stops" value="Potta Junction"> Potta</label>
                        <label><input type="checkbox" name="stops" value="Chalakudy Railway Station"> Chalakudy</label>
                        <label><input type="checkbox" name="stops" value="Irinjalakuda Stand"> Irinjalakuda</label>
                        <label><input type="checkbox" name="stops" value="Kallettumkara"> Kallettumkara</label>
                        <label><input type="checkbox" name="stops" value="Mapranam"> Mapranam</label>
                        <label><input type="checkbox" name="stops" value="Mannuthy"> Mannuthy</label>
                        <label><input type="checkbox" name="stops" value="Angamaly"> Angamaly</label>
                        <label><input type="checkbox" name="stops" value="Kodungallur"> Kodungallur</label>
                        <label><input type="checkbox" name="stops" value="ICCS Campus" checked> ICCS Campus</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn"><i class="fa-solid fa-plus-circle"></i> Add Bus & Stops</button>
            </form>

            <div style="margin-top:30px;">
                <h3 style="color:#d4af37;">Registered Buses (<span th:text="${#lists.size(buses)}">0</span>)</h3>
                <table>
                    <thead>
                        <tr><th>Bus ID</th><th>Reg No</th><th>Route</th><th>Driver</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="bus : ${buses}">
                            <td th:text="${bus.busId}" style="color:#d4af37; font-weight:bold;"></td>
                            <td th:text="${bus.regNumber}"></td>
                            <td th:text="${bus.route}" style="color:#60a5fa;"></td>
                            <td th:text="${bus.driverName}"></td>
                            <td th:text="${bus.status}"></td>
                            <td><button onclick="deleteBusAsync(this.getAttribute('data-id'))" th:data-id="${bus.busId}" style="background:rgba(239, 68, 68, 0.2); color:#f87171; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: STUDENT MANAGEMENT -->
        <div id="studentTab" style="display:none;">
            <form onsubmit="addStudentAsync(event)" style="background:#0f172a; padding:20px; border-radius:12px; border:1px solid #d4af37;">
                <h3 style="color:#d4af37; margin-top:0;">Add New Student Credentials</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div>
                        <label style="font-size:12px;">Student Username</label>
                        <input type="text" id="stUser" placeholder="e.g. anax" required style="width:100%; padding:10px; background:#090d16; border:1px solid #fff; color:#fff; border-radius:6px;">
                    </div>
                    <div>
                        <label style="font-size:12px;">Login Password</label>
                        <input type="password" id="stPass" placeholder="e.g. 1234" required style="width:100%; padding:10px; background:#090d16; border:1px solid #fff; color:#fff; border-radius:6px;">
                    </div>
                </div>
                <button type="submit" class="submit-btn" style="margin-top:15px;"><i class="fa-solid fa-user-plus"></i> Register Student</button>
            </form>

            <div style="margin-top:30px;">
                <h3 style="color:#d4af37;">Registered Students List</h3>
                <table>
                    <thead>
                        <tr><th>Username</th><th>Password</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="st : ${students}">
                            <td th:text="${st.key}" style="font-weight:bold; color:#60a5fa;"></td>
                            <td th:text="${st.value}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function checkAdminPassword() {
            if (document.getElementById("adminPasswordInput").value === "admin123") {
                document.getElementById("loginOverlay").style.display = "none";
            } else {
                document.getElementById("loginErr").style.display = "block";
            }
        }

        function switchTab(type) {
            if(type === 'bus') {
                document.getElementById("busTab").style.display = "block";
                document.getElementById("studentTab").style.display = "none";
                document.getElementById("btnBusTab").classList.add("active");
                document.getElementById("btnStudentTab").classList.remove("active");
            } else {
                document.getElementById("busTab").style.display = "none";
                document.getElementById("studentTab").style.display = "block";
                document.getElementById("btnStudentTab").classList.add("active");
                document.getElementById("btnBusTab").classList.remove("active");
            }
        }

        function addBusAsync(event) {
            event.preventDefault();
            var params = new URLSearchParams();
            params.append("busId", document.getElementById("busId").value.trim().toUpperCase());
            params.append("regNumber", document.getElementById("regNumber").value.trim().toUpperCase());
            params.append("route", document.getElementById("route").value);
            params.append("driverName", document.getElementById("driverName").value.trim());
            params.append("password", document.getElementById("password").value.trim());

            document.querySelectorAll('input[name="stops"]:checked').forEach(cb => { params.append("stops", cb.value); });

            fetch('/admin/addBus', { method: 'POST', body: params }).then(res => { if(res.ok) window.location.reload(); });
        }

        function addStudentAsync(event) {
            event.preventDefault();
            var params = new URLSearchParams();
            params.append("username", document.getElementById("stUser").value.trim().toLowerCase());
            params.append("password", document.getElementById("stPass").value.trim());

            fetch('/admin/addStudent', { method: 'POST', body: params }).then(res => { if(res.ok) window.location.reload(); });
        }

        function deleteBusAsync(busId) {
            if(!confirm("Remove bus " + busId + "?")) return;
            var params = new URLSearchParams();
            params.append("busId", busId);
            fetch('/admin/deleteBus', { method: 'POST', body: params }).then(res => { if(res.ok) window.location.reload(); });
        }
    </script>
</body>
</html>
