<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ICCS Driver Telemetry Console</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #090d16; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: rgba(30, 41, 59, 0.85); padding: 30px; border-radius: 20px; width: 100%; max-width: 480px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        .home-btn { position: absolute; top: 20px; left: 20px; background: #d4af37; color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #090d16; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        
        .stops-box { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px dashed #d4af37; margin-bottom: 20px; }
        .stops-list { margin: 8px 0 0 0; padding-left: 20px; font-size: 13px; color: #60a5fa; line-height: 1.6; }

        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 12px; transition: 0.3s; }
        .btn-start { background: #10b981; color: white; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .btn-sos { background: #f59e0b; color: #000; }
        .btn-clear { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }

        .status-box { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #d4af37; margin-bottom: 20px; text-align: center; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(8px); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #1e293b; border: 2px solid #ef4444; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; text-align: center; }
        .modal-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>

        <div class="header">
            <h2 style="color: #d4af37; margin: 0; font-size: 20px; margin-top: 20px;"><i class="fa-solid fa-id-card"></i> DRIVER CONSOLE</h2>
        </div>

        <div class="input-group">
            <label>Select Your Assigned Bus:</label>
            <select id="driverBusId" onchange="fetchAssignedStops()">
                <option th:each="bus : ${buses}" th:value="${bus.busId}" th:text="${bus.busId + ' - ' + bus.driverName + ' (' + bus.route + ')'}"></option>
            </select>
        </div>

        <div class="input-group">
            <label>Driver Access Password:</label>
            <input type="password" id="driverPassword" placeholder="Enter Password">
        </div>

        <div class="stops-box">
            <div style="font-size: 13px; font-weight: bold; color: #d4af37;"><i class="fa-solid fa-route"></i> Assigned Stops for this Bus:</div>
            <ol id="driverStopsList" class="stops-list">
                <li>Select a bus to view stops...</li>
            </ol>
        </div>

        <div class="status-box">
            <div>GPS Status: <b id="gpsStatusText" style="color: #f87171;">OFFLINE</b></div>
            <div style="margin-top: 5px;">Current Speed: <b id="speedText" style="color: #60a5fa;">0.0 km/h</b></div>
        </div>

        <button id="startBtn" onclick="startTrip()" class="btn btn-start"><i class="fa-solid fa-play"></i> START TRIP & BROADCAST GPS</button>
        <button id="stopBtn" onclick="stopTrip()" class="btn btn-stop"><i class="fa-solid fa-stop"></i> END TRIP</button>
        
        <button onclick="openSosModal()" class="btn btn-sos"><i class="fa-solid fa-triangle-exclamation"></i> 🚨 BROADCAST SOS ALERT</button>
        <button onclick="sendAlert('ACTIVE')" class="btn btn-clear"><i class="fa-solid fa-check-circle"></i> ✅ RESTORE NORMAL STATUS</button>
    </div>

    <div id="sosModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: #ef4444; margin-top: 0;"><i class="fa-solid fa-triangle-exclamation"></i> EMERGENCY SOS ALERT</h3>
            <p style="font-size: 13px; color: #cbd5e1;">Select the issue to notify students:</p>
            
            <button onclick="sendAlert('BREAKDOWN')" class="modal-btn" style="background: #ef4444; color: #fff;">🛠️ Vehicle Breakdown</button>
            <button onclick="sendAlert('TRAFFIC')" class="modal-btn" style="background: #f97316; color: #fff;">🚦 Heavy Traffic Block</button>
            <button onclick="sendAlert('RAIN')" class="modal-btn" style="background: #0284c7; color: #fff;">🌧️ Heavy Rain Delay</button>
            
            <button onclick="closeSosModal()" class="modal-btn" style="background: #475569; color: #fff; margin-bottom: 0;">Cancel</button>
        </div>
    </div>

    <script>
        var watchId = null;

        function fetchAssignedStops() {
            var busId = document.getElementById("driverBusId").value;
            if(!busId) return;

            fetch('/api/busStops/' + busId)
                .then(res => res.json())
                .then(stops => {
                    var listElem = document.getElementById("driverStopsList");
                    listElem.innerHTML = "";
                    if (!stops || stops.length === 0) {
                        listElem.innerHTML = "<li style='color:#94a3b8;'>No specific stops assigned by Admin.</li>";
                    } else {
                        stops.forEach(s => {
                            var li = document.createElement("li");
                            li.innerText = s;
                            listElem.appendChild(li);
                        });
                    }
                }).catch(e => {});
        }

        function openSosModal() { document.getElementById("sosModal").style.display = "flex"; }
        function closeSosModal() { document.getElementById("sosModal").style.display = "none"; }

        function startTrip() {
            var busId = document.getElementById("driverBusId").value;
            var pwd = document.getElementById("driverPassword").value;

            if(!pwd) { alert("Please enter your password!"); return; }

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(function(pos) {
                    var lat = pos.coords.latitude;
                    var lng = pos.coords.longitude;
                    var spd = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;

                    document.getElementById("gpsStatusText").innerText = "BROADCASTING LIVE";
                    document.getElementById("gpsStatusText").style.color = "#4ade80";
                    document.getElementById("speedText").innerText = spd.toFixed(1) + " km/h";

                    var params = new URLSearchParams();
                    params.append("busId", busId);
                    params.append("latitude", lat);
                    params.append("longitude", lng);
                    params.append("speed", spd);

                    // FIXED URL: Correct API path matching DriverController.java
                    fetch('/api/driver/updateLocation', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params 
                    });

                }, function(err) {
                    alert("GPS Error: Please enable location services in your browser.");
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });

                document.getElementById("startBtn").style.display = "none";
                document.getElementById("stopBtn").style.display = "block";
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function stopTrip() {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            var busId = document.getElementById("driverBusId").value;
            
            var params = new URLSearchParams();
            params.append("busId", busId);

            fetch('/api/driver/endTrip', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params 
            }).then(res => {
                document.getElementById("gpsStatusText").innerText = "OFFLINE";
                document.getElementById("gpsStatusText").style.color = "#f87171";
                document.getElementById("speedText").innerText = "0.0 km/h";
                document.getElementById("startBtn").style.display = "block";
                document.getElementById("stopBtn").style.display = "none";
            });
        }

        function sendAlert(alertType) {
            var busId = document.getElementById("driverBusId").value;
            var params = new URLSearchParams();
            params.append("busId", busId);
            params.append("status", alertType);

            fetch('/api/bus/updateAlert', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params 
            }).then(res => {
                if(res.ok) {
                    alert("Status Updated: " + alertType);
                    closeSosModal();
                }
            });
        }

        fetchAssignedStops();
    </script>
</body>
</html>
