<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Driver Telemetry Panel - ICCS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        :root { --bg-color: #0f171e; --card-bg: #1e293b; --accent-gold: #d4af37; --text-light: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background: var(--bg-color); color: var(--text-light); }
        .container { max-width: 600px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-family: 'Cinzel', serif; color: var(--accent-gold); text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: var(--accent-gold); margin-bottom: 8px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent-gold); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #b89528; }
        .status-box { margin-top: 20px; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fa-solid fa-satellite-dish"></i> Driver Telemetry Control</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 13px;">Update real-time coordinates for live student tracking</p>
        
        <div class="form-group">
            <label><i class="fa-solid fa-bus"></i> Select Assigned Bus</label>
            <select id="driverBusSelect">
                <option th:each="bus : ${buses}" th:value="${bus.busId}" th:text="${bus.busNumber + ' - ' + bus.driverName}"></option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-location-dot"></i> Latitude Coordinates</label>
            <input type="text" id="latInput" value="10.3542">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-location-dot"></i> Longitude Coordinates</label>
            <input type="text" id="lngInput" value="76.2825">
        </div>

        <button class="btn-submit" onclick="sendTelemetry()"><i class="fa-solid fa-paper-plane"></i> Update Live GPS Telemetry</button>

        <div class="status-box" id="statusMsg">
            Status: Ready to stream GPS coordinates
        </div>
    </div>

    <script>
        function sendTelemetry() {
            var busId = document.getElementById("driverBusSelect").value;
            var lat = parseFloat(document.getElementById("latInput").value);
            var lng = parseFloat(document.getElementById("lngInput").value);

            fetch('/api/driver/update-location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ busId: busId, latitude: lat, longitude: lng })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("statusMsg").innerHTML = `<span style="color:#4ade80;"><i class="fa-solid fa-check"></i> Telemetry Sent Successfully!</span>`;
            })
            .catch(err => {
                document.getElementById("statusMsg").innerHTML = `<span style="color:#f87171;"><i class="fa-solid fa-xmark"></i> Update Failed</span>`;
            });
        }
    </script>
</body>
</html>
