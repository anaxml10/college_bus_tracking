<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ICCS Student Tracking Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #090d16; color: #fff; margin: 0; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.75); padding: 25px; border-radius: 20px; max-width: 950px; margin: auto; border: 1px solid rgba(212, 175, 55, 0.3); position: relative; }
        .home-btn { position: absolute; top: 20px; left: 20px; background: #d4af37; color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .header { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .box { background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 12px; }
        select { width: 100%; padding: 10px; background: #090d16; color: #fff; border-radius: 8px; border: 1px solid #d4af37; margin-bottom: 10px; }
        #map { height: 400px; border-radius: 14px; border: 2px solid #d4af37; margin-top: 15px; }
        .breakdown-banner { background: #ef4444; color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>

        <div class="header">
            <h1 style="color: #d4af37; margin: 0; font-size: 22px;"><i class="fa-solid fa-bus"></i> STUDENT BUS TRACKING</h1>
        </div>

        <div id="breakdownAlert" class="breakdown-banner">
            <i class="fa-solid fa-triangle-exclamation"></i> ALERT: VEHICLE BREAKDOWN REPORTED FOR THIS BUS!
        </div>

        <div class="grid">
            <div class="box">
                <label style="color: #d4af37; font-weight: 600; display: block; margin-bottom: 6px;">Select Bus:</label>
                <select id="busSelect" onchange="onBusChange()">
                    <option th:each="bus : ${buses}" th:value="${bus.busId}" th:text="${bus.busId + ' - (' + bus.route + ')'}"></option>
                </select>

                <label style="color: #d4af37; font-weight: 600; display: block; margin-bottom: 6px;">Your Boarding Stop:</label>
                <select id="stopSelect" onchange="updateStopLocation()"></select>
            </div>

            <div class="box">
                <div>Status: <b id="busStatus" style="color:#f87171;">INACTIVE</b></div>
                <div style="margin-top: 8px;">Speed: <b id="busSpeed" style="color:#60a5fa;">0.0 km/h</b></div>
                <div style="margin-top: 8px;">ETA: <b id="eta" style="color:#4ade80;">Waiting for Live GPS...</b></div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        const stopCoordinatesDB = {
            "Thrissur Swaraj Round": [10.5244, 76.2137],
            "Ollur Junction": [10.4704, 76.2335],
            "Amballur Junction": [10.4395, 76.2625],
            "Puthukkad Bus Stop": [10.4285, 76.2711], // NH 544
            "Kodakara Junction": [10.3662, 76.3082],
            "Potta Junction": [10.3288, 76.3262],
            "Chalakudy Railway Station": [10.3072, 76.3353],
            "Irinjalakuda Stand": [10.3421, 76.2148],
            "Kallettumkara": [10.3458, 76.2482],
            "Mapranam": [10.3685, 76.2312],
            "Mannuthy": [10.5367, 76.2626],
            "Angamaly": [10.1960, 76.3860],
            "Kodungallur": [10.2227, 76.1979],
            "ICCS Campus": [10.3391, 76.3051]
        };

        var stopLat = 10.3528, stopLng = 76.2818;
        var map = L.map('map').setView([10.3528, 76.2818], 12);
        var initialCenteringDone = false;

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);

        var busMarker = L.marker([10.3528, 76.2818]).addTo(map);
        var stopMarker = L.marker([stopLat, stopLng]).addTo(map);

        function onBusChange() {
            var busSelect = document.getElementById("busSelect");
            if (!busSelect || !busSelect.value) return;

            fetch('/api/busStops/' + busSelect.value)
                .then(res => res.json())
                .then(stops => {
                    var stopSelect = document.getElementById("stopSelect");
                    stopSelect.innerHTML = "";

                    if(!stops || stops.length === 0) {
                        var opt = document.createElement("option");
                        opt.value = stopCoordinatesDB["ICCS Campus"].join(",");
                        opt.innerText = "ICCS Campus";
                        stopSelect.appendChild(opt);
                    } else {
                        stops.forEach(s => {
                            if(stopCoordinatesDB[s]) {
                                var opt = document.createElement("option");
                                opt.value = stopCoordinatesDB[s][0] + "," + stopCoordinatesDB[s][1];
                                opt.innerText = s;
                                stopSelect.appendChild(opt);
                            }
                        });
                    }
                    initialCenteringDone = false;
                    updateStopLocation();
                }).catch(e => {});
        }

        function updateStopLocation() {
            var stopSelect = document.getElementById("stopSelect");
            if(!stopSelect || !stopSelect.value) return;
            var coords = stopSelect.value.split(",");
            stopLat = parseFloat(coords[0]);
            stopLng = parseFloat(coords[1]);
            stopMarker.setLatLng([stopLat, stopLng]);
            trackBus();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = (lat2-lat1) * Math.PI / 180; var dLon = (lon2-lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function trackBus() {
            var busSelect = document.getElementById("busSelect");
            if (!busSelect || !busSelect.value) return;

            fetch('/api/bus/' + busSelect.value).then(res => res.json()).then(data => {
                if(!data) return;
                var bLat = data.latitude, bLng = data.longitude;

                if (bLat && bLng && bLat !== 0) {
                    busMarker.setLatLng([bLat, bLng]);
                    if (!initialCenteringDone) { map.setView([bLat, bLng], 14); initialCenteringDone = true; }
                }

                if(data.status === "BREAKDOWN") {
                    document.getElementById("breakdownAlert").style.display = "block";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#ef4444;'>BREAKDOWN</span>";
                    document.getElementById("eta").innerText = "Transit Delayed";
                } else if(data.status === "ACTIVE") {
                    document.getElementById("breakdownAlert").style.display = "none";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#4ade80;'>ACTIVE</span>";
                    document.getElementById("busSpeed").innerText = (data.speed || 0).toFixed(1) + " km/h";
                    if (bLat !== 0 && bLng !== 0) {
                        var dist = calculateDistance(bLat, bLng, stopLat, stopLng);
                        var speed = data.speed > 5 ? data.speed : 30;
                        var mins = Math.round((dist / speed) * 60);
                        document.getElementById("eta").innerText = dist < 0.2 ? "Arrived at Stop" : mins + " mins (" + dist.toFixed(1) + " km)";
                    }
                } else {
                    document.getElementById("breakdownAlert").style.display = "none";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#f87171;'>INACTIVE</span>";
                    document.getElementById("eta").innerText = "Trip Not Started";
                }
            }).catch(e => {});
        }

        onBusChange();
        setInterval(trackBus, 3000);
    </script>
</body>
</html>
