<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ICCS Student Tracking Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #090d16; color: #fff; margin: 0; padding: 20px; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.98); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(212, 175, 55, 0.4); padding: 35px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .login-box input { width: 100%; padding: 12px; background: #090d16; border: 1px solid #d4af37; color: white; border-radius: 8px; margin: 15px 0; outline: none; font-size: 14px; text-align: center; }
        .login-box button { background: linear-gradient(135deg, #d4af37, #f59e0b); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .card { background: rgba(30, 41, 59, 0.75); padding: 25px; border-radius: 20px; max-width: 950px; margin: auto; border: 1px solid rgba(212, 175, 55, 0.3); position: relative; }
        .home-btn { position: absolute; top: 20px; left: 20px; background: #d4af37; color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .header { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 20px; }
        
        .alert-banner { padding: 15px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 14px; margin-bottom: 20px; display: none; border: 2px solid #fff; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.8; } }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .box { background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 12px; }
        select { width: 100%; padding: 10px; background: #090d16; color: #fff; border-radius: 8px; border: 1px solid #d4af37; margin-bottom: 10px; }
        #map { height: 400px; border-radius: 14px; border: 2px solid #d4af37; margin-top: 15px; }

        /* Custom Bus Marker Style */
        .bus-marker-icon { background: #d4af37; color: #000; border-radius: 50%; border: 2px solid #fff; text-align: center; line-height: 30px; font-size: 16px; box-shadow: 0 0 10px rgba(212,175,55,0.8); }
    </style>
</head>
<body>

    <div id="studentLoginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 style="color: #d4af37; margin-top:0;"><i class="fa-solid fa-user-graduate"></i> STUDENT LOGIN</h2>
            <p style="font-size: 13px; color: #cbd5e1;">Enter Admin Registered Credentials</p>
            <input type="text" id="studentUsername" placeholder="Username (e.g. anax)">
            <input type="password" id="studentPassword" placeholder="Password (e.g. 1234)">
            <button onclick="checkStudentLogin()">LOGIN</button>
            <div id="studentLoginErr" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Invalid Username or Password!</div>
        </div>
    </div>

    <div class="card">
        <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>

        <div class="header">
            <h1 style="color: #d4af37; margin: 0; font-size: 22px;"><i class="fa-solid fa-bus"></i> STUDENT BUS TRACKING</h1>
        </div>
        
        <div id="tripDirection" style="text-align:center; color:#60a5fa; margin-bottom:15px; font-weight:800; font-size:15px;"></div>

        <div id="alertBanner" class="alert-banner"></div>

        <div class="grid">
            <div class="box">
                <label style="color: #d4af37; font-weight: 600; display: block; margin-bottom: 6px;">Select Bus:</label>
                <select id="busSelect" onchange="onBusChange()">
                    <option th:each="bus : ${buses}" th:value="${bus.busId}" th:text="${bus.busId + ' - (' + bus.route + ')'}"></option>
                </select>

                <label style="color: #d4af37; font-weight: 600; display: block; margin-bottom: 6px;">Your Boarding Stop:</label>
                <select id="stopSelect" onchange="updateStopLocation()"></select>
            </div>

            <div class="box">
                <div>Status: <b id="busStatus" style="color:#f87171;">INACTIVE</b></div>
                <div style="margin-top: 8px;">Speed: <b id="busSpeed" style="color:#60a5fa;">0.0 km/h</b></div>
                <div style="margin-top: 8px;">ETA: <b id="eta" style="color:#4ade80;">Waiting for Live GPS...</b></div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        function checkStudentLogin() {
            var u = document.getElementById("studentUsername").value.trim();
            var p = document.getElementById("studentPassword").value.trim();
            var params = new URLSearchParams();
            params.append("username", u);
            params.append("password", p);

            fetch('/api/student/login', { method: 'POST', body: params })
                .then(res => {
                    if(res.ok) {
                        document.getElementById("studentLoginOverlay").style.display = "none";
                    } else {
                        document.getElementById("studentLoginErr").style.display = "block";
                    }
                });
        }

        const stopCoordinatesDB = {
            "Thrissur Swaraj Round": [10.5244, 76.2137],
            "Ollur Junction": [10.4704, 76.2335],
            "Amballur Junction": [10.4395, 76.2625],
            "Puthukkad Bus Stop": [10.4285, 76.2711], // NH 544
            "Kodakara Junction": [10.3662, 76.3082],
            "Potta Junction": [10.3288, 76.3262],
            "Chalakudy Railway Station": [10.3072, 76.3353],
            "Irinjalakuda Stand": [10.3421, 76.2148],
            "Kallettumkara": [10.3458, 76.2482],
            "Mapranam": [10.3685, 76.2312],
            "Mannuthy": [10.5367, 76.2626],
            "Angamaly": [10.1960, 76.3860],
            "Kodungallur": [10.2227, 76.1979],
            "ICCS Campus": [10.3391, 76.3051]
        };

        var stopLat = 10.3391, stopLng = 76.3051;
        var map = L.map('map').setView([10.3528, 76.2818], 12);
        var initialCenteringDone = false;

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);

        // Separate Bus & Stop Icons
        var busIcon = L.divIcon({ className: 'bus-marker-icon', html: '<i class="fa-solid fa-bus"></i>', iconSize: [32, 32] });
        var busMarker = L.marker([10.3528, 76.2818], { icon: busIcon }).addTo(map);
        var stopMarker = L.marker([stopLat, stopLng]).addTo(map);

        function updateTripDirectionContext() {
            var hr = new Date().getHours();
            document.getElementById("tripDirection").innerText = hr < 15 ? "☀️ Morning Trip: Towards ICCS Campus" : "🌆 Evening Trip: Return to Home Stops";
        }

        function onBusChange() {
            var busSelect = document.getElementById("busSelect");
            if (!busSelect || !busSelect.value) return;

            updateTripDirectionContext();

            fetch('/api/busStops/' + busSelect.value)
                .then(res => res.json())
                .then(stops => {
                    var stopSelect = document.getElementById("stopSelect");
                    stopSelect.innerHTML = "";
                    if(!stops || stops.length === 0) {
                        var opt = document.createElement("option");
                        opt.value = stopCoordinatesDB["ICCS Campus"].join(",");
                        opt.innerText = "ICCS Campus";
                        stopSelect.appendChild(opt);
                    } else {
                        stops.forEach(s => {
                            if(stopCoordinatesDB[s]) {
                                var opt = document.createElement("option");
                                opt.value = stopCoordinatesDB[s][0] + "," + stopCoordinatesDB[s][1];
                                opt.innerText = s;
                                stopSelect.appendChild(opt);
                            }
                        });
                    }
                    initialCenteringDone = false;
                    updateStopLocation();
                }).catch(e => {});
        }

        function updateStopLocation() {
            var stopSelect = document.getElementById("stopSelect");
            if(!stopSelect || !stopSelect.value) return;
            var coords = stopSelect.value.split(",");
            stopLat = parseFloat(coords[0]);
            stopLng = parseFloat(coords[1]);
            stopMarker.setLatLng([stopLat, stopLng]);
            trackBus();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = (lat2-lat1) * Math.PI / 180; var dLon = (lon2-lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function trackBus() {
            var busSelect = document.getElementById("busSelect");
            if (!busSelect || !busSelect.value) return;

            fetch('/api/bus/' + busSelect.value).then(res => res.json()).then(data => {
                if(!data) return;
                var bLat = data.latitude, bLng = data.longitude;

                if (bLat && bLng && bLat !== 0) {
                    busMarker.setLatLng([bLat, bLng]);
                    if (!initialCenteringDone) { map.setView([bLat, bLng], 14); initialCenteringDone = true; }
                }

                var banner = document.getElementById("alertBanner");
                var st = data.status ? data.status.trim().toUpperCase() : "INACTIVE";

                if(st === "BREAKDOWN") {
                    banner.style.display = "block"; banner.style.background = "#ef4444";
                    banner.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> ALERT: VEHICLE BREAKDOWN REPORTED!";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#ef4444;'>BREAKDOWN</span>";
                } else if(st === "TRAFFIC") {
                    banner.style.display = "block"; banner.style.background = "#f97316";
                    banner.innerHTML = "<i class='fa-solid fa-traffic-light'></i> ALERT: HEAVY TRAFFIC BLOCK REPORTED!";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#f97316;'>TRAFFIC</span>";
                } else if(st === "RAIN") {
                    banner.style.display = "block"; banner.style.background = "#0284c7";
                    banner.innerHTML = "<i class='fa-solid fa-cloud-showers-heavy'></i> ALERT: HEAVY RAIN DELAY REPORTED!";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#0284c7;'>RAIN DELAY</span>";
                } else if(st === "ACTIVE") {
                    banner.style.display = "none";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#4ade80;'>ACTIVE</span>";
                    document.getElementById("busSpeed").innerText = (data.speed || 0).toFixed(1) + " km/h";
                    if (bLat !== 0 && bLng !== 0) {
                        var dist = calculateDistance(bLat, bLng, stopLat, stopLng);
                        var speed = data.speed > 5 ? data.speed : 30;
                        var mins = Math.round((dist / speed) * 60);
                        document.getElementById("eta").innerText = dist < 0.2 ? "Arrived at Stop" : mins + " mins (" + dist.toFixed(1) + " km)";
                    }
                } else {
                    banner.style.display = "none";
                    document.getElementById("busStatus").innerHTML = "<span style='color:#f87171;'>INACTIVE</span>";
                    document.getElementById("eta").innerText = "Trip Not Started";
                }
            }).catch(e => {});
        }

        onBusChange();
        setInterval(trackBus, 3000);
    </script>
</body>
</html>
