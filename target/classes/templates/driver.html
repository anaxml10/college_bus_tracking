<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ICCS Driver Console</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #090d16; color: #fff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); padding: 30px; border-radius: 20px; max-width: 500px; width: 100%; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .home-btn { background: linear-gradient(135deg, #d4af37, #f59e0b); color: #000; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

        .header h1 { color: #d4af37; font-size: 18px; font-weight: 800; margin: 0; }

        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px; background: #090d16; border: 1px solid rgba(212,175,55,0.4); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-start { background: #10b981; color: #fff; }
        .btn-breakdown { background: #ef4444; color: #fff; }
        .btn-reset { background: #f59e0b; color: #000; margin-top: 8px; }
        .btn-stop { background: #64748b; color: #fff; margin-top: 8px; }

        .status-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        #statusMsg { font-size: 13px; font-weight: 600; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-bar">
            <div class="header">
                <h1>DRIVER CONSOLE</h1>
            </div>
            <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <form id="driverLoginForm" onsubmit="startTrip(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-bus"></i> Select Bus</label>
                <select id="busSelect" required>
                    <option th:each="b : ${buses}" th:value="${b.busId}" th:text="${b.busId + ' - ' + b.driverName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-start"><i class="fa-solid fa-location-arrow"></i> START TRIP & GPS</button>
        </form>

        <div id="controls" style="display: none;">
            <button onclick="reportBreakdown()" class="btn btn-breakdown"><i class="fa-solid fa-triangle-exclamation"></i> REPORT BREAKDOWN</button>
            <button onclick="resetStatus()" class="btn btn-reset"><i class="fa-solid fa-rotate-left"></i> CLEAR BREAKDOWN (RESET NORMAL)</button>
            <button onclick="endTrip()" class="btn btn-stop"><i class="fa-solid fa-circle-stop"></i> END TRIP</button>
        </div>

        <div class="status-box">
            <div style="font-size: 12px; color: #94a3b8;">GPS TRANSMISSION STATUS</div>
            <div id="statusMsg" style="color: #f87171;"><i class="fa-solid fa-circle-pause"></i> STANDBY</div>
        </div>
    </div>

    <script>
        var watchId = null;
        var activeBusId = null;

        function startTrip(event) {
            event.preventDefault();
            activeBusId = document.getElementById("busSelect").value;
            var password = document.getElementById("password").value;

            var params = new URLSearchParams();
            params.append("busId", activeBusId);
            params.append("password", password);

            fetch('/api/driver/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            })
            .then(res => {
                if(res.ok) {
                    document.getElementById("driverLoginForm").style.display = "none";
                    document.getElementById("controls").style.display = "block";
                    document.getElementById("statusMsg").style.color = "#34d399";
                    document.getElementById("statusMsg").innerHTML = `<i class="fa-solid fa-satellite-dish"></i> LIVE GPS TRANSMITTING`;

                    startGPSBroadcast();
                } else {
                    alert("Invalid Driver Password!");
                }
            });
        }

        function startGPSBroadcast() {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(sendLocation, err => console.log(err), { enableHighAccuracy: true });
            }
        }

        function sendLocation(position) {
            var params = new URLSearchParams();
            params.append("busId", activeBusId);
            params.append("latitude", position.coords.latitude);
            params.append("longitude", position.coords.longitude);
            params.append("speed", position.coords.speed ? (position.coords.speed * 3.6) : 0);

            fetch('/api/driver/updateLocation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
        }

        function reportBreakdown() {
            if(!confirm("Report Vehicle Breakdown to Students?")) return;
            var params = new URLSearchParams();
            params.append("busId", activeBusId);

            fetch('/api/driver/reportBreakdown', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            }).then(() => {
                document.getElementById("statusMsg").style.color = "#f87171";
                document.getElementById("statusMsg").innerText = "BREAKDOWN REPORTED TO STUDENTS";
            });
        }

        function resetStatus() {
            var params = new URLSearchParams();
            params.append("busId", activeBusId);
            params.append("latitude", 0);
            params.append("longitude", 0);
            params.append("speed", 0);

            fetch('/api/driver/updateLocation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            }).then(() => {
                document.getElementById("statusMsg").style.color = "#34d399";
                document.getElementById("statusMsg").innerText = "STATUS RESET TO NORMAL (ACTIVE)";
            });
        }

        function endTrip() {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            var params = new URLSearchParams();
            params.append("busId", activeBusId);

            fetch('/api/driver/endTrip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
