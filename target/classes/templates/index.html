<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCS Smart Transit | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        .login-card h2 { color: #1e3c72; margin-bottom: 8px; font-size: 24px; }
        .login-card p { color: #666; font-size: 13px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus, select:focus { border-color: #1e3c72; }
        .btn-login { 
            width: 100%; 
            padding: 14px; 
            background: #1e3c72; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        .btn-login:hover { background: #2a5298; }
        .error-message { 
            color: #de350b; 
            background: #ffebe6; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            margin-bottom: 15px; 
            display: none; 
        }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-btn { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            background: #f8f9fa; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500; 
        }
        .role-btn.active { background: #1e3c72; color: white; border-color: #1e3c72; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ICCS College Bus Tracking</h2>
        <p>Smart Transportation Management System</p>

        <div id="errorBox" class="error-message">Invalid Username or Password!</div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Select Portal / Role</label>
                <select id="roleSelect" onchange="toggleCredentialsRequirement()">
                    <option value="student">Student Portal</option>
                    <option value="driver">Driver Telemetry</option>
                    <option value="admin">Admin Console</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username (e.g. admin)" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password (e.g. 1234)" required>
            </div>

            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            var role = document.getElementById("roleSelect").value;
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var errorBox = document.getElementById("errorBox");

            // Admin Logic Validation
            if (role === "admin") {
                if (user === "admin" && pass === "1234") {
                    window.location.href = "/admin";
                } else {
                    errorBox.style.display = "block";
                    errorBox.innerText = "Invalid Admin Credentials! Use admin / 1234";
                }
            } else if (role === "driver") {
                window.location.href = "/driver";
            } else {
                window.location.href = "/student";
            }
            return false;
        }

        function toggleCredentialsRequirement() {
            var role = document.getElementById("roleSelect").value;
            var errorBox = document.getElementById("errorBox");
            errorBox.style.display = "none";
        }
    </script>
</body>
</html>
